! Cisco IOS Virtual Switch Configuration - Layer 2 Security (DAI & DHCP Snooping)
version 15.2
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname Switch-L2-IoT
!
vlan 10
 name IoT_LAN_Segment
!
ip dhcp snooping
ip dhcp snooping vlan 10
no ip dhcp snooping information option
!
ip arp inspection vlan 10
ip arp inspection validate src-mac dst-mac ip
!
interface GigabitEthernet0/1
 description Connected to Mosquitto Broker Server
 switchport mode access
 switchport access vlan 10
 ip dhcp snooping trust
 ip arp inspection trust
!
interface GigabitEthernet0/2
 description Connected to IoT Sensor Node (Publisher)
 switchport mode access
 switchport access vlan 10
 ip dhcp snooping limit rate 20
!
interface GigabitEthernet0/3
 description Connected to Attacker Node (Kali Linux)
 switchport mode access
 switchport access vlan 10
 ip dhcp snooping limit rate 5
!
end
